<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>

    <!-- Inner Glow -->
    <radialGradient id="innerShine" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- App Icon Squircle Clip -->
    <clipPath id="squircleClip">
      <rect x="16" y="16" width="480" height="480" rx="115" ry="115" />
    </clipPath>
  </defs>

  <!-- Shadow under the squircle -->
  <rect x="20" y="28" width="472" height="472" rx="115" ry="115" fill="#3E2723" opacity="0.25" />

  <!-- Main Squircle Body -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Background -->
    <rect x="16" y="16" width="480" height="480" fill="url(#bgGrad)" />

    <!-- Subtle Retro Pixel Checkers Grid -->
    <g opacity="0.08" fill="#4E342E">
      <pattern id="pixelGrid" width="32" height="32" patternUnits="userSpaceOnUse">
        <rect width="16" height="16" fill="#4E342E" />
        <rect x="16" y="16" width="16" height="16" fill="#4E342E" />
      </pattern>
      <rect x="16" y="16" width="480" height="480" fill="url(#pixelGrid)" />
    </g>

    <!-- Inner Highlight -->
    <rect x="16" y="16" width="480" height="480" fill="url(#innerShine)" />

    <!-- Golden Sparkles -->
    <g fill="#FFF9C4">
      <!-- Top Left Sparkle -->
      <rect x="68" y="80" width="12" height="36" rx="4" />
      <rect x="56" y="92" width="36" height="12" rx="4" />

      <!-- Top Right Sparkle -->
      <rect x="420" y="110" width="10" height="28" rx="3" />
      <rect x="411" y="119" width="28" height="10" rx="3" />

      <!-- Bottom Right Little Sparkle -->
      <rect x="430" y="380" width="8" height="20" rx="2" />
      <rect x="424" y="386" width="20" height="8" rx="2" />
    </g>

    <!-- Centered 16-bit Pixel Mascot (Scale: 20x20 per pixel, offset to center x=96, y=106) -->
    <g transform="translate(96, 96)">
      <!-- Swirl Tip -->
      <rect x="140" y="20" width="40" height="20" fill="#4E342E" />
      <rect x="120" y="40" width="80" height="20" fill="#795548" />
      <rect x="140" y="40" width="40" height="20" fill="#8D6E63" />

      <!-- Tier 1 -->
      <rect x="100" y="60" width="120" height="20" fill="#4E342E" />
      <rect x="100" y="80" width="120" height="40" fill="#795548" />
      <rect x="120" y="80" width="40" height="20" fill="#8D6E63" />
      <rect x="80" y="80" width="20" height="40" fill="#4E342E" />
      <rect x="220" y="80" width="20" height="40" fill="#4E342E" />

      <!-- Tier 2 (Face section) -->
      <rect x="60" y="120" width="200" height="80" fill="#795548" />
      <rect x="40" y="120" width="20" height="80" fill="#4E342E" />
      <rect x="260" y="120" width="20" height="80" fill="#4E342E" />
      <rect x="80" y="120" width="60" height="20" fill="#8D6E63" />

      <!-- Big Kawaii Eyes -->
      <!-- Left Eye -->
      <rect x="80" y="120" width="60" height="60" fill="#FFFFFF" />
      <rect x="100" y="140" width="40" height="40" fill="#212121" />
      <rect x="100" y="140" width="20" height="20" fill="#FFFFFF" />

      <!-- Right Eye -->
      <rect x="180" y="120" width="60" height="60" fill="#FFFFFF" />
      <rect x="180" y="140" width="40" height="40" fill="#212121" />
      <rect x="180" y="140" width="20" height="20" fill="#FFFFFF" />

      <!-- Rosy Cheeks -->
      <rect x="60" y="180" width="40" height="20" fill="#FF8A80" opacity="0.9" />
      <rect x="220" y="180" width="40" height="20" fill="#FF8A80" opacity="0.9" />

      <!-- Joyful Open Smile -->
      <rect x="140" y="180" width="40" height="20" fill="#3E2723" />
      <rect x="140" y="200" width="40" height="20" fill="#FF5252" />

      <!-- Tier 3 Base -->
      <rect x="40" y="200" width="240" height="40" fill="#795548" />
      <rect x="20" y="200" width="20" height="40" fill="#4E342E" />
      <rect x="280" y="200" width="20" height="40" fill="#4E342E" />

      <rect x="40" y="240" width="240" height="20" fill="#3E2723" />
      <rect x="60" y="260" width="200" height="20" fill="#4E342E" />
    </g>

    <!-- Warm chocolate border -->
    <rect x="16" y="16" width="480" height="480" rx="115" ry="115" fill="none" stroke="#4E342E" stroke-width="12" stroke-opacity="0.3" />
  </g>
</svg>
