name: Build Standalone Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/PoopPal.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoopPal-APK
          path: android/app/build/outputs/apk/debug/PoopPal.apk

      - name: Update GitHub Release Assets
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: PoopPal v1.1.0 - Paired Duo Home Screen Widgets & Live Sync
          body: |
            ### What's New in v1.1.0:
            - **4x2 Paired Friend Home Screen Widget**: Live companion widget displaying joint daily flush metrics, pixel mascot companion with partner crown, and 1-tap quick logging.
            - **2x2 Compact Duo Widget**: Dedicated 2x2 home screen widget with side-by-side counts and 1-tap logging.
            - **Live Android Sync**: Background flushes logged via the widget or notification tile synchronize automatically with the app and Firestore.
            - **Eliminated Auth Flash**: Added authentication gate and loading splash preventing sign-in screen flashes on app launch.
          files: android/app/build/outputs/apk/debug/PoopPal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
